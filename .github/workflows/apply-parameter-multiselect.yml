name: Apply parameter multi-select context menu

on:
  push:
    branches: [parameter-multiselect-menu]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parameter-multiselect-menu
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch helper
        run: python tools/apply_parameter_multiselect.py
      - name: Commit implementation and remove helpers
        shell: bash
        run: |
          rm tools/apply_parameter_multiselect.py
          rm .github/workflows/apply-parameter-multiselect.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add parameter multi-select copy paste actions"
          git push origin HEAD:parameter-multiselect-menu
