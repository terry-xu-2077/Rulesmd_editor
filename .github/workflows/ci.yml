name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python backend
        run: python -m pip install -e .[dev]
      - name: Python tests
        run: pytest -q
      - name: Python compile
        run: python -m compileall -q src
      - name: Portable build script syntax (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/build-portable.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install }
      - name: React TypeScript build
        working-directory: frontend
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Tauri icons
        working-directory: frontend
        run: npm run tauri -- icon src-tauri/app-icon.png --output src-tauri/icons
      - name: Cargo check
        working-directory: frontend/src-tauri
        run: cargo check
